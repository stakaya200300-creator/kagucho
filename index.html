<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2b5d9b">
<meta name="mobile-web-app-capable" content="yes">
<title>家具調</title>
<style>
  :root { --main:#2b5d9b; --main2:#3f7cc4; --bg:#f4f6f9; --line:#d5dbe3; --text:#222; --sub:#6b7380; --warn:#c0392b; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif; background:var(--bg); color:var(--text); font-size:16px; }
  button { font-family:inherit; cursor:pointer; }
  .hidden { display:none !important; }

  .bar { position:sticky; top:0; z-index:10; background:var(--main); color:#fff; display:flex; align-items:center; height:52px; padding:0 4px; }
  .bar .back { background:none; border:0; color:#fff; font-size:24px; width:44px; height:44px; }
  .bar h1 { flex:1; font-size:17px; margin:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .bar .act { background:none; border:0; color:#fff; font-size:14px; padding:8px 10px; }
  main { padding:12px 12px 110px; max-width:680px; margin:0 auto; }

  .hero { position:relative; background:linear-gradient(135deg,var(--main),var(--main2)); color:#fff; padding:36px 20px 28px; text-align:center; }
  .hero h1 { margin:0 0 4px; font-size:26px; letter-spacing:.1em; }
  .hero p { margin:0; opacity:.85; font-size:13px; }
  .hero .gear { position:absolute; right:8px; top:8px; background:none; border:0; color:#fff; font-size:22px; opacity:.85; width:44px; height:44px; }
  .menu { display:grid; gap:12px; margin-top:-16px; }
  .menu button { display:flex; align-items:center; gap:14px; width:100%; padding:20px 18px; border:0; border-radius:14px; background:#fff;
                 box-shadow:0 2px 6px rgba(0,0,0,.1); text-align:left; color:var(--text); }
  .menu .ic { font-size:30px; width:52px; height:52px; border-radius:12px; display:flex; align-items:center; justify-content:center; background:#e8eef7; }
  .menu .primary { background:var(--main); color:#fff; }
  .menu .primary .ic { background:rgba(255,255,255,.18); }
  .menu b { display:block; font-size:18px; }
  .menu small { opacity:.75; font-size:12px; }
  .sec-h { font-weight:bold; font-size:14px; color:var(--sub); margin:22px 2px 8px; }

  .card { background:#fff; border-radius:12px; padding:12px; margin-bottom:12px; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  label.t { display:block; font-size:13px; color:var(--sub); margin:0 0 6px; font-weight:bold; }
  .gap { margin-top:12px; }
  input[type=text], input[type=number], input[type=date], input[type=search], input[type=url], input[type=password], textarea {
    width:100%; padding:11px 10px; border:1px solid var(--line); border-radius:8px; font-size:16px; background:#fff; font-family:inherit; }
  textarea { min-height:64px; resize:vertical; }
  .note { font-size:12px; color:var(--sub); margin-top:6px; line-height:1.5; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; }
  .chip { padding:7px 12px; border:1px solid var(--line); border-radius:20px; background:#fff; font-size:14px; color:var(--text); }
  .chip.on { background:var(--main); color:#fff; border-color:var(--main); }
  .dims { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .dims div { position:relative; }
  .dims span { position:absolute; left:10px; top:11px; color:var(--sub); font-weight:bold; }
  .dims input { padding-left:30px; }
  .bigcam { display:flex; align-items:center; justify-content:center; gap:10px; width:100%; padding:18px; border-radius:12px; border:0;
            background:var(--main); color:#fff; font-weight:bold; font-size:19px; box-shadow:0 2px 6px rgba(43,93,155,.35); }
  .sublinks { display:flex; justify-content:center; gap:18px; margin-top:10px; font-size:13px; }
  .sublinks label { color:var(--main); text-decoration:underline; }
  .check { display:flex; align-items:center; gap:8px; font-size:14px; margin-top:12px; }
  .check input { width:20px; height:20px; }
  .shots { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-top:10px; }
  .shots div { position:relative; aspect-ratio:1; }
  .shots img { width:100%; height:100%; object-fit:cover; border-radius:8px; }
  .shots i { position:absolute; right:3px; bottom:3px; font-style:normal; font-size:11px; background:rgba(0,0,0,.65); color:#fff; border-radius:10px; padding:1px 6px; }
  .shots .ok i { background:#2e8b57; } .shots .err i { background:var(--warn); }
  .upstat { font-size:13px; margin-top:10px; padding:8px 10px; border-radius:8px; background:#f0f3f8; color:var(--sub); }
  .upstat.err { background:#fdecea; color:var(--warn); }
  .cur-item { font-size:13px; color:var(--main); font-weight:bold; margin-top:10px; }

  .btn { width:100%; padding:14px; border:0; border-radius:10px; background:var(--main); color:#fff; font-size:16px; font-weight:bold; }
  .btn:disabled { background:#9aaabf; }
  .btn.sub { background:#fff; color:var(--main); border:1px solid var(--main); }
  .btn.danger { background:var(--warn); }
  .btn.gray { background:#fff; color:var(--sub); border:1px solid var(--line); }
  .row2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px; }
  .footbar { position:fixed; left:0; right:0; bottom:0; padding:10px 12px calc(10px + env(safe-area-inset-bottom)); background:#fff;
             box-shadow:0 -2px 8px rgba(0,0,0,.1); z-index:5; }
  .footbar .in { max-width:680px; margin:0 auto; display:flex; gap:8px; }
  .footbar .btn { flex:1; }

  .seg { display:grid; grid-template-columns:1fr 1fr; background:#e3e8ef; border-radius:10px; padding:3px; margin-top:10px; }
  .seg button { border:0; background:none; padding:9px; border-radius:8px; font-size:14px; font-weight:bold; color:var(--sub); }
  .seg button.on { background:#fff; color:var(--main); box-shadow:0 1px 2px rgba(0,0,0,.1); }
  .sv { display:flex; gap:12px; background:#fff; border-radius:12px; padding:10px; margin-bottom:10px; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .sv .cv { width:76px; height:76px; border-radius:10px; background:#e6e9ee center/cover; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:26px; }
  .sv .bd { flex:1; min-width:0; }
  .sv .nm { font-weight:bold; font-size:17px; }
  .sv .mt { color:var(--sub); font-size:12px; margin-top:2px; }
  .sv .mm { font-size:13px; margin-top:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .sv .ops { display:flex; gap:6px; margin-top:8px; }
  .sv .ops button { flex:1; padding:7px 4px; border-radius:8px; border:1px solid var(--line); background:#fff; font-size:13px; color:var(--text); }
  .sv .ops .p { background:var(--main); border-color:var(--main); color:#fff; }
  .badge { display:inline-block; font-size:11px; padding:1px 7px; border-radius:10px; background:#eee; color:var(--sub); margin-left:6px; vertical-align:2px; font-weight:normal; }
  .empty { text-align:center; color:var(--sub); padding:30px 0; font-size:14px; }

  .info .nm { font-size:20px; font-weight:bold; }
  .info .mt { color:var(--sub); font-size:13px; margin-top:4px; }
  .info .mm { margin-top:8px; font-size:14px; white-space:pre-wrap; }
  .ledger { margin-top:12px; padding-top:12px; border-top:1px solid var(--line); }
  .ledger .lk { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:8px; }
  .ledger .lk button { padding:10px; border-radius:8px; border:1px solid var(--main); background:#fff; color:var(--main); font-weight:bold; font-size:14px; }
  .ledger .mk { width:100%; padding:11px; border-radius:8px; border:0; background:#e8eef7; color:var(--main); font-weight:bold; font-size:15px; }
  .room-h { font-weight:bold; margin:18px 0 8px; color:var(--main); border-left:4px solid var(--main); padding-left:8px; }
  .grid { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; }
  .ph { background:#fff; border-radius:10px; overflow:hidden; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .ph .im { width:100%; aspect-ratio:4/3; background:#e6e9ee center/cover; display:flex; align-items:center; justify-content:center; color:var(--sub); font-size:12px; }
  .ph .tx { padding:6px 8px; font-size:13px; line-height:1.4; }
  .ph .it { font-weight:bold; }
  .ph .dm { color:var(--main); font-weight:bold; }
  .ph .dt { color:var(--sub); font-size:11px; }

  /* アプリ内カメラ */
  .cam { position:fixed; inset:0; background:#000; z-index:40; display:flex; flex-direction:column; }
  .cam video { flex:1; width:100%; min-height:0; object-fit:contain; background:#000; }
  .cam-top { position:absolute; left:0; right:0; top:0; padding:calc(10px + env(safe-area-inset-top)) 12px 10px;
             background:linear-gradient(rgba(0,0,0,.6),transparent); color:#fff; font-size:14px; font-weight:bold; }
  .cam-top small { display:block; font-weight:normal; opacity:.85; font-size:12px; margin-top:2px; }
  .cam-bottom { display:flex; align-items:center; justify-content:space-between; padding:16px 28px calc(20px + env(safe-area-inset-bottom)); background:#000; }
  .shutter { width:76px; height:76px; border-radius:50%; border:5px solid #fff; background:#fff; box-shadow:inset 0 0 0 3px #000; }
  .shutter:active { transform:scale(.92); }
  .cam-side { width:64px; height:64px; border-radius:12px; border:1px solid #555; background:#222; color:#fff; font-size:20px; line-height:1.1; }
  .cam-side small { display:block; font-size:11px; }
  .cam-last { position:relative; width:64px; height:64px; border-radius:12px; overflow:hidden; background:#222; border:2px solid #fff; }
  .cam-last img { width:100%; height:100%; object-fit:cover; }
  .cam-last b { position:absolute; right:2px; top:2px; background:var(--main); color:#fff; border-radius:10px; font-size:12px; padding:0 6px; }
  .cam-stat { position:absolute; left:50%; transform:translateX(-50%); bottom:calc(120px + env(safe-area-inset-bottom)); background:rgba(0,0,0,.6);
              color:#fff; font-size:12px; padding:4px 10px; border-radius:12px; white-space:nowrap; }
  .cam-flash { position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; transition:opacity .25s; }
  .cam-flash.on { opacity:.7; transition:none; }

  .modal { position:fixed; inset:0; background:rgba(0,0,0,.5); display:none; align-items:flex-end; z-index:20; }
  .modal .in { background:#fff; width:100%; max-width:680px; margin:0 auto; border-radius:16px 16px 0 0; padding:16px 16px calc(16px + env(safe-area-inset-bottom)); max-height:92vh; overflow:auto; }
  .modal img { width:100%; border-radius:8px; margin-bottom:10px; min-height:120px; background:#eee; }
  .modal h2 { margin:0 0 12px; font-size:18px; }
  #toast { position:fixed; left:50%; bottom:96px; transform:translateX(-50%); background:rgba(0,0,0,.82); color:#fff; white-space:pre-line;
           padding:10px 16px; border-radius:20px; font-size:14px; display:none; z-index:60; max-width:90%; text-align:center; }
  #loading { position:fixed; inset:0; background:rgba(255,255,255,.6); display:none; align-items:center; justify-content:center; z-index:50; font-size:14px; color:var(--sub); text-align:center; padding:20px; }
</style>
</head>
<body>

<!-- ================= トップ ================= -->
<section id="v-home">
  <div class="hero"><button class="gear" onclick="go('settings')">⚙</button><h1>家具調</h1><p>施主宅 現況・家具調査</p></div>
  <main>
    <div class="menu">
      <button class="primary" onclick="go('new')"><span class="ic">＋</span><span><b>新規家具調 立上げ</b><small>邸名を登録して撮影を開始</small></span></button>
      <button onclick="go('list')"><span class="ic">🗂</span><span><b>家具調リスト</b><small>進行中の案件を検索・確認</small></span></button>
    </div>
    <div class="sec-h">最近の案件</div>
    <div id="recent"><div class="empty">読み込み中…</div></div>
  </main>
</section>

<!-- ================= 設定 ================= -->
<section id="v-settings" class="hidden">
  <div class="bar"><button class="back" onclick="back()">‹</button><h1>設定</h1></div>
  <main>
    <div class="card">
      <label class="t">API のURL（Apps Script のウェブアプリURL）</label>
      <input type="url" id="sApi" placeholder="https://script.google.com/macros/s/…/exec">
      <label class="t gap">パスコード（setup 実行時のログに表示された8桁）</label>
      <input type="password" id="sToken" inputmode="numeric">
      <label class="t gap">担当者名（台帳の「担当」「登録者」に入ります）</label>
      <input type="text" id="sUser" placeholder="例）瀬名">
      <div class="note">この設定はこのスマホにだけ保存されます。</div>
    </div>
    <button class="btn" onclick="saveSettings()">保存して接続テスト</button>
  </main>
</section>

<!-- ================= 新規立上げ ================= -->
<section id="v-new" class="hidden">
  <div class="bar"><button class="back" onclick="back()">‹</button><h1>新規家具調 立上げ</h1></div>
  <main>
    <div class="card">
      <label class="t">邸名 <span style="color:var(--warn)">*</span></label>
      <input type="text" id="nSite" placeholder="例）山田邸">
      <label class="t gap">調査日</label>
      <input type="date" id="nDate">
      <label class="t gap">メモ</label>
      <textarea id="nMemo" placeholder="例）建替え。既存家具の移設確認"></textarea>
    </div>
    <button class="btn" id="nBtn" onclick="createSurvey()">📷 立上げて撮影開始</button>
  </main>
</section>

<!-- ================= 撮影 ================= -->
<section id="v-shot" class="hidden">
  <div class="bar"><button class="back" onclick="back()">‹</button><h1 id="shotTitle">撮影</h1>
    <button class="act" onclick="go('detail',cur.id)">写真一覧</button></div>
  <main>
    <div class="card">
      <label class="t">部屋</label>
      <div class="chips" id="roomChips"></div>
      <input type="text" id="room" placeholder="部屋名（タップ or 入力）">
    </div>
    <div class="card">
      <label class="t">品目</label>
      <div class="chips" id="itemChips"></div>
      <input type="text" id="item" placeholder="品目（タップ or 入力）">
      <label class="t gap">寸法（mm）</label>
      <div class="dims">
        <div><span>W</span><input type="number" inputmode="numeric" id="w"></div>
        <div><span>D</span><input type="number" inputmode="numeric" id="d"></div>
        <div><span>H</span><input type="number" inputmode="numeric" id="h"></div>
      </div>
      <label class="t gap">メモ</label>
      <textarea id="memo" placeholder="例）新居の寝室へ移設。上置きあり"></textarea>
    </div>
    <div class="card">
      <button class="bigcam" onclick="openCamera()">📷 カメラを起動して撮影</button>
      <div class="sublinks">
        <label for="file">標準カメラで撮る</label>
        <label for="album">アルバムから選ぶ</label>
      </div>
      <input type="file" id="file" accept="image/*" capture="environment" class="hidden">
      <input type="file" id="album" accept="image/*" multiple class="hidden">
      <label class="check"><input type="checkbox" id="burn" checked> 写真に品目・寸法を書き込む</label>
      <div class="cur-item" id="curItem"></div>
      <div class="shots" id="shots"></div>
      <div class="upstat" id="upstat"></div>
    </div>
  </main>
  <div class="footbar"><div class="in">
    <button class="btn" onclick="nextItem()">次の家具へ ➜</button>
    <button class="btn sub" style="flex:0 0 30%" onclick="go('detail',cur.id)">完了</button>
  </div></div>
</section>

<!-- アプリ内カメラ -->
<div class="cam hidden" id="cam">
  <video id="video" playsinline muted autoplay></video>
  <div class="cam-top"><span id="camInfo"></span><small id="camSub"></small></div>
  <div class="cam-flash" id="flash"></div>
  <div class="cam-stat" id="camStat"></div>
  <div class="cam-bottom">
    <button class="cam-side" onclick="back()">✎<small>入力へ</small></button>
    <button class="shutter" id="shutterBtn" onclick="shutter()" aria-label="撮影"></button>
    <div class="cam-last" onclick="back()"><img id="camLast" alt=""><b id="camCount">0</b></div>
  </div>
</div>

<!-- ================= 家具調リスト ================= -->
<section id="v-list" class="hidden">
  <div class="bar"><button class="back" onclick="back()">‹</button><h1>家具調リスト</h1>
    <button class="act" onclick="go('new')">＋新規</button></div>
  <main>
    <input type="search" id="q" placeholder="🔍 邸名・メモ・品目で検索" oninput="renderList()">
    <div class="seg">
      <button id="segA" class="on" onclick="setMode('active')">進行中</button>
      <button id="segB" onclick="setMode('archived')">アーカイブ</button>
    </div>
    <div id="listCount" class="sec-h"></div>
    <div id="listBody"></div>
  </main>
</section>

<!-- ================= 案件詳細 ================= -->
<section id="v-detail" class="hidden">
  <div class="bar"><button class="back" onclick="back()">‹</button><h1 id="detTitle">案件</h1>
    <button class="act" onclick="openSurveyEdit()">編集</button></div>
  <main>
    <div class="card info" id="detInfo"></div>
    <div id="detPhotos"></div>
  </main>
  <div class="footbar"><div class="in">
    <button class="btn" id="detShot" onclick="go('shot',cur.id)">📷 撮影する</button>
    <button class="btn gray" id="detArc" onclick="toggleArchive(cur)">📦 アーカイブ化</button>
  </div></div>
</section>

<!-- 写真の修正 -->
<div class="modal" id="mPhoto" onclick="if(event.target===this)closeModal(this)">
  <div class="in">
    <img id="mImg" alt="">
    <label class="t">品目</label><input type="text" id="mItem">
    <label class="t gap">寸法（mm）</label>
    <div class="dims">
      <div><span>W</span><input type="number" inputmode="numeric" id="mW"></div>
      <div><span>D</span><input type="number" inputmode="numeric" id="mD"></div>
      <div><span>H</span><input type="number" inputmode="numeric" id="mH"></div>
    </div>
    <label class="t gap">メモ</label><textarea id="mMemo"></textarea>
    <div class="row2">
      <button class="btn" onclick="savePhotoEdit()">修正を保存</button>
      <button class="btn sub" onclick="window.open(curPhoto.url,'_blank')">ドライブで開く</button>
    </div>
    <div class="row2">
      <button class="btn danger" onclick="removePhoto()">削除</button>
      <button class="btn gray" onclick="closeModal($('mPhoto'))">閉じる</button>
    </div>
  </div>
</div>

<!-- 案件の修正 -->
<div class="modal" id="mSurvey" onclick="if(event.target===this)closeModal(this)">
  <div class="in">
    <h2>案件情報の編集</h2>
    <label class="t">邸名</label><input type="text" id="eSite">
    <label class="t gap">調査日</label><input type="date" id="eDate">
    <label class="t gap">メモ</label><textarea id="eMemo"></textarea>
    <div class="row2">
      <button class="btn" onclick="saveSurveyEdit()">保存</button>
      <button class="btn gray" onclick="closeModal($('mSurvey'))">閉じる</button>
    </div>
    <button class="btn sub" style="margin-top:10px" onclick="window.open(cur.folderUrl,'_blank')">📁 ドライブのフォルダを開く</button>
  </div>
</div>

<div id="loading"><span id="loadingMsg">読み込み中…</span></div>
<div id="toast"></div>

<script>
/* ===== 設定 =====
   DEFAULT_API_URL に Apps Script のウェブアプリURLを貼っておくと、スマホの設定画面ではパスコードだけ入れればOK */
const DEFAULT_API_URL = '';

/* よく使う候補（自由に編集してください） */
const ROOMS = ['LDK','リビング','ダイニング','キッチン','和室','寝室','子供部屋','洋室','玄関','洗面','浴室','トイレ','廊下','納戸','屋外'];
const ITEMS = ['タンス','食器棚','テレビ台','ソファ','ダイニングテーブル','ベッド','冷蔵庫','洗濯機','仏壇','神棚','ピアノ','本棚','エアコン','照明','カーテン'];
const MAX = 1920;   // 保存サイズ（長辺px）

let view = 'home';
let cur = null, curPhoto = null, surveys = [], mode = 'active';

/* ================= 共通 ================= */
function $(id){ return document.getElementById(id); }
function ls(k, v){ try { if (v !== undefined) localStorage.setItem('kgc_'+k, v); return localStorage.getItem('kgc_'+k) || ''; } catch(e){ return ''; } }
const CFG = { get api(){ return ls('api') || DEFAULT_API_URL; }, get token(){ return ls('token'); }, get user(){ return ls('user'); } };
function toast(msg, ms){ const t=$('toast'); t.textContent=msg; t.style.display='block'; clearTimeout(t._h); t._h=setTimeout(()=>t.style.display='none', ms||2200); }
function loading(on, msg){ $('loadingMsg').textContent = msg || '読み込み中…'; $('loading').style.display = on ? 'flex' : 'none'; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function dimText(o){ return [['W',o.w],['D',o.d],['H',o.h]].filter(x=>x[1]!==''&&x[1]!=null).map(x=>x[0]+x[1]).join(' '); }
function today(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function closeModal(el){ el.style.display='none'; }
function norm(s){ return String(s||'').normalize('NFKC').toLowerCase().replace(/[ぁ-ゖ]/g,c=>String.fromCharCode(c.charCodeAt(0)+0x60)); }

/** Apps Script API を呼ぶ */
async function run(fn, ...args){
  if (!CFG.api || !CFG.token) throw new Error('設定（URL・パスコード）が未入力です');
  let res;
  try { res = await fetch(CFG.api, { method:'POST', body: JSON.stringify({ token:CFG.token, fn, args }) }); }
  catch(e){ throw new Error('通信できません（電波を確認してください）'); }
  let j;
  try { j = await res.json(); } catch(e){ throw new Error('APIに接続できません（URL・デプロイ設定を確認）'); }
  if (!j.ok) throw new Error(j.error || 'エラー');
  return j.result;
}

/* ================= 画面遷移（#/画面/ID　再読み込みしても同じ画面に戻る） ================= */
const PARENT = {home:'home', settings:'home', new:'home', list:'home', detail:'list', shot:'detail'};
function hashOf(v, id, sub){ return '#/'+v+(id?'/'+id:'')+(sub?'/'+sub:''); }
function depth(){ return (history.state && history.state.n) || 0; }
function go(v, id, sub){ history.pushState({n:depth()+1}, '', hashOf(v,id,sub)); route(); }
function replaceTo(v, id, sub){ history.replaceState({n:depth()}, '', hashOf(v,id,sub)); route(); }
function back(){
  if (depth()>0) history.back();
  else if (stream || !$('cam').classList.contains('hidden')) replaceTo('shot', cur && cur.id);   // カメラだけ閉じる
  else replaceTo(PARENT[view]||'home', cur && cur.id);
}
window.addEventListener('popstate', route);
function route(){
  const [v, id, sub] = (location.hash || '#/home').replace(/^#\/?/,'').split('/');
  show(v || 'home', id || '', sub || '');
}

function show(v, id, sub){
  if (!(v==='shot' && sub==='cam')) stopCamera();
  if (!CFG.api || !CFG.token) v = 'settings';
  view = v;
  ['home','settings','new','shot','list','detail'].forEach(n => $('v-'+n).classList.toggle('hidden', n!==v));
  window.scrollTo(0,0);
  if (v==='home')     loadHome();
  if (v==='settings') { $('sApi').value=CFG.api; $('sToken').value=CFG.token; $('sUser').value=CFG.user; }
  if (v==='new')      { $('nSite').value=''; $('nMemo').value=''; $('nDate').value=today(); setTimeout(()=>$('nSite').focus(),100); }
  if (v==='shot')     openShot(id, sub==='cam');
  if (v==='list')     loadList();
  if (v==='detail')   loadDetail(id);
}

/* ================= 撮影 =================
   アプリ内カメラで撮る → その場で縮小 → スマホ内に一時保管 → すぐドライブへ送信。
   カメラアプリに切り替わらないので画面が落ちず、枚数制限なく連続で撮れる。 */
const FORM_IDS = ['room','item','w','d','h','memo'];
let queue = [];      // 送信待ち
let shots = [];      // 今の家具で撮った写真（表示用）
let shotSid = null, uploading = false, retryTimer = null, lastErr = '';
let stream = null;

const DB = (() => {
  let p = null;
  function open(){
    return p || (p = new Promise((ok,ng) => {
      const r = indexedDB.open('kaguchou', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('drafts', {keyPath:'key'});
      r.onsuccess = () => ok(r.result); r.onerror = () => ng(r.error);
    }));
  }
  async function tx(mode, fn){
    const db = await open();
    return new Promise((ok,ng) => {
      const t = db.transaction('drafts', mode); const req = fn(t.objectStore('drafts'));
      t.oncomplete = () => ok(req && req.result); t.onerror = () => ng(t.error);
    });
  }
  const safe = f => async (...a) => { try { return await f(...a); } catch(e){ return null; } };
  return { put: safe(o=>tx('readwrite',s=>s.put(o))), del: safe(k=>tx('readwrite',s=>s.delete(k))),
           get: safe(k=>tx('readonly',s=>s.get(k))), all: safe(()=>tx('readonly',s=>s.getAll())) };
})();

}

/* ---------- アプリ内カメラ ---------- */
function openCamera(){
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { toast('このブラウザはアプリ内カメラに未対応です。標準カメラを使います'); return $('file').click(); }
  go('shot', cur.id, 'cam');   // スマホの「戻る」でカメラを閉じられるように
}
async function startCamera(){
  if (stream) return;
  $('cam').classList.remove('hidden');
  const i=currentInfo();
  $('camInfo').textContent = cur.site + (i.room ? '　'+i.room : '');
  $('camSub').textContent = [i.item, dimText(i)].filter(Boolean).join('  ') || '（品目未入力）';
  renderCam();
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio:false,
      video:{ facingMode:{ideal:'environment'}, width:{ideal:2560}, height:{ideal:1920} } });
    const v=$('video'); v.srcObject=stream; await v.play();
  } catch(e){
    stopCamera(); back();
    toast('カメラを起動できません（'+(e.name||e.message)+'）\nカメラの使用を許可するか、「標準カメラで撮る」を使ってください', 6000);
  }
}
function stopCamera(){
  if (stream) { stream.getTracks().forEach(t=>t.stop()); stream=null; }
  const v=$('video'); if (v) v.srcObject=null;
  $('cam').classList.add('hidden');
}
async function shutter(){
  const v=$('video');
  if (!v.videoWidth) return;
  const f=$('flash'); f.classList.add('on'); setTimeout(()=>f.classList.remove('on'), 60);
  if (navigator.vibrate) navigator.vibrate(25);
  const s=Math.min(1, MAX/Math.max(v.videoWidth, v.videoHeight));
  const cv=document.createElement('canvas'); cv.width=Math.round(v.videoWidth*s); cv.height=Math.round(v.videoHeight*s);
  cv.getContext('2d').drawImage(v, 0, 0, cv.width, cv.height);
  await addShot(cv, currentInfo(), $('burn').checked);
}
function renderCam(){
  const last = shots[shots.length-1];
  $('camLast').src = last ? last.thumb : '';
  $('camCount').textContent = shots.length;
  const n=queue.length;
  $('camStat').textContent = n ? (lastErr ? '⚠ 未送信 '+n+'枚（自動で再送）' : '⏫ 送信中 '+n+'枚') : (shots.length ? '✅ '+shots.length+'枚 保存済み' : 'シャッターを押すと自動で保存');
}

/* ---------- 標準カメラ・アルバム ---------- */
function loadImage(src){ return new Promise((ok,ng)=>{ const img=new Image(); img.onload=()=>ok(img); img.onerror=ng; img.src=src; }); }
async function fileToCanvas(file){
  const url = URL.createObjectURL(file);
  let img = null;
  try {
    img = await loadImage(url);
    const s=Math.min(1, MAX/Math.max(img.naturalWidth, img.naturalHeight));
    const cv=document.createElement('canvas'); cv.width=Math.round(img.naturalWidth*s); cv.height=Math.round(img.naturalHeight*s);
    cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
    return cv;
  } finally { if (img) img.src=''; URL.revokeObjectURL(url); }
}
async function onPick(e){
  const files=[].slice.call(e.target.files); e.target.value='';
  if (!files.length || !cur) return;
  const info=currentInfo(), burn=$('burn').checked;
  for (let i=0;i<files.length;i++) {
    $('upstat').textContent = '写真を処理中… '+(i+1)+'/'+files.length;
    try { const cv = await fileToCanvas(files[i]); files[i]=null; await addShot(cv, info, burn); }
    catch(err){ toast('写真の読み込みに失敗しました'); }
  }
  renderStatus();
}

/* ---------- 共通：書き込み → 一時保管 → 送信 ---------- */
async function addShot(cv, info, burn){
  const w=cv.width, h=cv.height, c=cv.getContext('2d');
  if (burn) {
    const lines = [ [info.item, dimText(info)].filter(Boolean).join('  '), info.memo,
                    [cur.site, info.room, new Date().toLocaleDateString('ja-JP')].filter(Boolean).join(' / ') ].filter(Boolean);
    const fs=Math.round(Math.min(w,h)*0.045), pad=Math.round(fs*0.5), lh=Math.round(fs*1.3), bandH=pad*2+lh*lines.length;
    c.fillStyle='rgba(0,0,0,0.55)'; c.fillRect(0,h-bandH,w,bandH);
    c.fillStyle='#fff'; c.textBaseline='top';
    lines.forEach((t,i)=>{
      const last = i===lines.length-1;
      c.font=(i===0&&!last?'bold ':'')+(last?Math.round(fs*0.75):fs)+'px sans-serif';
      c.fillText(t, pad, h-bandH+pad+lh*i, w-pad*2);
    });
  }
  const dataUrl = cv.toDataURL('image/jpeg', 0.85);
  const ts=Math.min(1, 200/Math.max(w,h)), tc=document.createElement('canvas');
  tc.width=Math.round(w*ts); tc.height=Math.round(h*ts);
  tc.getContext('2d').drawImage(cv,0,0,tc.width,tc.height);
  const thumb = tc.toDataURL('image/jpeg', 0.6);
  cv.width=cv.height=0; tc.width=tc.height=0;   // メモリ解放

  const rec = { key:'p_'+cur.id+'_'+Date.now()+'_'+Math.random().toString(36).slice(2,6), sid:cur.id, t:Date.now(),
                dataUrl, thumb, info, user:CFG.user };
  await DB.put(rec);                // 先にスマホ内へ一時保管（落ちても消えない）
  queue.push(rec);
  shots.push({ key:rec.key, thumb, state:'wait' });
  renderShots(); pump();
}

/** 送信キューを1枚ずつ送る（失敗したら10秒後に自動で再送） */
async function pump(){
  if (uploading || !queue.length) { renderStatus(); return; }
  uploading = true; clearTimeout(retryTimer);
  try {
    while (queue.length) {
      const rec = queue[0];
      setShot(rec.key, 'up'); renderStatus();
      try {
        await run('savePhoto', Object.assign({}, rec.info, { surveyId:rec.sid, dataUrl:rec.dataUrl, key:rec.key, user:rec.user }));
      } catch(e) {
        lastErr = e.message || '通信エラー';
        setShot(rec.key, 'err');
        if (/パスコード|設定|不明/.test(lastErr)) toast('⚠ '+lastErr, 5000);
        retryTimer = setTimeout(pump, 10000);
        break;
      }
      queue.shift(); await DB.del(rec.key);
      lastErr=''; setShot(rec.key, 'ok');
    }
  } finally { uploading = false; renderStatus(); }
}
function setShot(key, state){ const s=shots.find(x=>x.key===key); if (s) { s.state=state; renderShots(); } }
function renderShots(){
  const mark = {wait:'待機', up:'送信中', ok:'✓', err:'再送待ち'};
  $('shots').innerHTML = shots.map(s=>'<div class="'+s.state+'"><img src="'+s.thumb+'"><i>'+mark[s.state]+'</i></div>').join('');
  renderCam();
}
function renderStatus(){
  const el=$('upstat'), n=queue.length;
  el.classList.toggle('err', !!lastErr && n>0);
  if (n && lastErr) el.textContent = '⚠ 送信できていない写真 '+n+'枚（電波が戻ると自動で再送します）';
  else if (n)       el.textContent = '⏫ 送信中… 残り '+n+'枚';
  else if (shots.length) el.textContent = '✅ この家具の写真 '+shots.filter(s=>s.state==='ok').length+'枚 保存済み';
  else              el.textContent = '品目・寸法を入れてから撮影 → 自動でドライブに保存されます';
  renderCam();
}
async function restoreQueue(){
  if (!CFG.api || !CFG.token) return;
  const ps = ((await DB.all()) || []).filter(r=>r.dataUrl).sort((a,b)=>a.t-b.t);
  if (!ps.length) return;
  const known = new Set(queue.map(r=>r.key));
  ps.forEach(r => { if (!known.has(r.key)) queue.push(r); });
  toast('未送信の写真 '+ps.length+'枚 を送信します', 3500);
  pump();
}
function nextItem(){
  shots = [];
  ['item','w','d','h','memo'].forEach(id=>$(id).value=''); syncChips('itemChips','item');

    await run('updateSurvey', cur.id, {site:$('eSite').value.trim(), date:$('eDate').value, memo:$('eMemo').value.trim()});
    toast('保存しました'); closeModal($('mSurvey')); loadDetail(cur.id);
  } catch(e){ toast('エラー: '+e.message,5000); }
}
async function openPhoto(i){
  curPhoto=cur.photos[i];
  $('mImg').src=curPhoto.thumb || '';
  $('mItem').value=curPhoto.item||''; $('mW').value=curPhoto.w; $('mD').value=curPhoto.d; $('mH').value=curPhoto.h; $('mMemo').value=curPhoto.memo||'';
  $('mPhoto').style.display='flex';
  const id=curPhoto.id;
  try { const big = await run('getImage', id, 1200); if (big && curPhoto && curPhoto.id===id) $('mImg').src=big; } catch(e){}
}
async function savePhotoEdit(){
  try {
    await run('updatePhoto', curPhoto.id, {item:$('mItem').value.trim(), w:$('mW').value, d:$('mD').value, h:$('mH').value, memo:$('mMemo').value.trim()});
    toast('修正しました'); closeModal($('mPhoto')); loadDetail(cur.id);
  } catch(e){ toast('エラー: '+e.message,5000); }
}
async function removePhoto(){
  if (!confirm('この写真を削除しますか？（ドライブではゴミ箱へ移動）')) return;
  try { await run('deletePhoto', curPhoto.id); toast('削除しました'); closeModal($('mPhoto')); loadDetail(cur.id); }
  catch(e){ toast('エラー: '+e.message,5000); }
}
</script>
</body>
